<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แปลงตัวอักษรจ้า</title>
    <!-- นำเข้าฟอนต์ Mali จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Mali', cursive;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #d1c4e9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .app-card {
            background-color: #c4b5fd;
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .title {
            color: #1e1b4b;
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 20px;
        }

textarea {
    width: 100%;
    height: 220px;
    min-height: 120px; /* กำหนดความสูงขั้นต่ำ ไม่ให้ย่อจนเล็กเกินไป */
    background-color: #e0f2fe;
    border: none;
    border-radius: 20px;
    padding: 20px;
    font-size: 19px;
    color: #334155;
    resize: both; /* เปลี่ยนเป็น both เพื่อให้ดึงขยาย-ย่อได้ทั้งแนวตั้งและแนวนอน */
    outline: none;
    margin-bottom: 20px;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
}

        textarea::placeholder {
            color: #94a3b8;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 20px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-orange { background-color: #ff8a3d; }
        .btn-blue { background-color: #4f46e5; }
        .btn-red { background-color: #ff5252; }
        .btn-green { background-color: #00c853; }

        /* แจ้งเตือน Toast ลอยแบบหายเอง */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #1e1b4b;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 480px) {
            .button-grid { grid-template-columns: 1fr; }
            .title { font-size: 28px; }
            .btn { font-size: 18px; padding: 14px; }
        }
    </style>
</head>
<body>

    <div class="app-card">
        <h1 class="title">แปลงตัวอักษรจ้า</h1>
        
        <textarea id="inputText" placeholder="พิมพ์หรือวางข้อความที่นี่..."></textarea>
        
        <div class="button-grid">
            <button class="btn btn-orange" onclick="convertText('lower')">แปลงเป็นตัวพิมพ์เล็ก</button>
            <button class="btn btn-blue" onclick="convertText('upper')">แปลงเป็นตัวพิมพ์ใหญ่</button>
            <button class="btn btn-red" onclick="clearText()">ล้างหน้าจอ</button>
            <button class="btn btn-green" onclick="copyText()">คัดลอก</button>
        </div>
    </div>

    <div id="toast" class="toast">คัดลอกข้อความแล้ว!</div>

    <script>
        function convertText(type) {
            let textarea = document.getElementById("inputText");
            let text = textarea.value;

            if (!text.trim()) return;

            // ลบสเปซท้ายบรรทัด + ลบบรรทัดว่าง
            let cleanText = text
                .split('\n')
                .map(line => line.trimEnd())
                .filter(line => line.trim() !== '')
                .join('\n');

            if (type === 'lower') {
                textarea.value = cleanText.toLowerCase();
            } else if (type === 'upper') {
                textarea.value = cleanText.toUpperCase();
            }
        }

        function clearText() {
            document.getElementById("inputText").value = "";
        }

        function copyText() {
            let textarea = document.getElementById("inputText");
            
            if (!textarea.value) {
                showToast("ไม่มีข้อความให้คัดลอกจ้า!");
                return;
            }

            textarea.select();
            navigator.clipboard.writeText(textarea.value).then(() => {
                showToast("คัดลอกข้อความแล้ว!");
            }).catch(() => {
                document.execCommand('copy');
                showToast("คัดลอกข้อความแล้ว!");
            });
        }

        let toastTimer;
        function showToast(message) {
            let toast = document.getElementById("toast");
            toast.innerText = message;
            toast.classList.add("show");

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove("show");
            }, 2000);
        }
    </script>

</body>
</html>
